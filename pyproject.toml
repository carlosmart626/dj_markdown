[build-system]
# >=64 so the recursive "**" globs in [tool.setuptools.package-data] are
# handled reliably (recursive glob support landed in setuptools 62.3).
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dj_markdown"
description = "Django Markdown custom plugin and template tags"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [{ name = "Carlos Martínez", email = "carlosmart626@gmail.com" }]
keywords = ["django", "markdown", "templatetags", "code", "highlight"]
dynamic = ["version"]
dependencies = [
    "Django>=5.2",
    "mistune>=3.0",
    "Pygments>=2.17",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "Django>=5.2,<6.0",
    "flake8",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/CarlosMart626/dj_markdown"
Source = "https://github.com/CarlosMart626/dj_markdown"

[tool.setuptools.dynamic]
version = { attr = "dj_markdown.__version__" }

[tool.setuptools.packages.find]
include = ["dj_markdown*"]

[tool.setuptools.package-data]
dj_markdown = [
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
